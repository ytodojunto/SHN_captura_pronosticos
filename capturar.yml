name: Capturar pronóstico SHN

# Corre solo, en la nube de GitHub, sin depender de tu PC.
# Horarios en UTC: 09:00 y 21:00 UTC ≈ 06:00 y 18:00 hora Argentina,
# cerca de cuando el SHN suele actualizar el pronóstico.
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}  # también se puede disparar a mano desde la web de GitHub

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Capturar pronóstico
        run: python capturar_pronostico.py

      - name: Guardar cambios en el repo
        run: |
          git config user.name "shn-capture-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Captura pronóstico $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
