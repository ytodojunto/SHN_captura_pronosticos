name: Reparar historico (una sola vez)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reparar historico.jsonl
        run: python reparar_historico.py

      - name: Guardar cambios en el repo
        run: |
          git config user.name 'shn-capture-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || git commit -m 'Reparar filas corruptas de historico.jsonl (bug de parseo)'
          git push
