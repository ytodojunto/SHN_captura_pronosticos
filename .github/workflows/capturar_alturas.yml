name: Capturar alturas horarias observadas SHN

on:
  schedule:
    - cron: '15 9 * * *'
    - cron: '15 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Capturar alturas horarias observadas
        run: python capturar_alturas.py

      - name: Guardar cambios en el repo
        run: |
          git config user.name 'shn-capture-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || git commit -m 'Captura automatica de alturas horarias'
          git push
